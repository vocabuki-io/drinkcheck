<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0A0C">
<title>ドリンクチェック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* ドリンクチェック v2 — Layout: one-screen phone app. Story rings on top (A案), full-height swipe reel below (B案). Single deliberate dark look for low bar lighting. */
:root{
  --bg:#0A0A0C; --surface:#17171B; --surface2:#24242A; --fg:#F5F5F7; --sub:#A6A6AF; --line:#3A3A42;
  --accent:#3DE0FF; --on-accent:#00141A; --zero:#FF4D42; --scrim:rgba(0,0,0,.42);
  --display:'Dela Gothic One','Hiragino Sans','Noto Sans JP',sans-serif;
  --body:'Zen Kaku Gothic New',-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}

.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;overflow:clip;background:var(--bg)}

/* top: header + stories */
.top{flex-shrink:0;background:var(--bg);border-bottom:1px solid #1E1E23;z-index:5}
.bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 4px 0 14px;overflow:hidden;overflow:clip}
.logo{font-family:var(--display);font-size:17px;letter-spacing:-.3px;flex-shrink:0}
.seg{flex:1;min-width:0;display:flex;justify-content:center}
.seg-in{display:flex;background:var(--surface);border-radius:999px;padding:3px}
.seg button{height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--sub);font-size:13px;font-weight:700;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%}
.stories{display:flex;gap:14px;overflow-x:auto;padding:6px 14px 12px}
.story{flex-shrink:0;width:72px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.ring{position:relative;width:68px;height:68px}
.ring>svg{position:absolute;inset:0;overflow:visible}
.ring .badge svg{display:block}
.ring .glow{filter:drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 8px var(--accent));animation:pulse 1.8s ease-in-out infinite}
.ring .face{position:absolute;inset:7px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;color:#fff}
.ring .badge{position:absolute;right:-1px;bottom:-1px;width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.story .lbl{width:74px;font-size:11px;font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.story .cnt{font-size:10px;font-weight:700;color:var(--accent);margin-top:-3px;font-variant-numeric:tabular-nums}
.story .cnt.fin{color:var(--sub)}
.story.cur .lbl{color:var(--fg);font-weight:900}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* reel */
.reel{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;position:relative}
.slide{height:var(--slideH,700px);position:relative;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always}
.bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.bg img{width:100%;height:100%;object-fit:cover}
.bg .ini{font-family:var(--display);font-size:150px;color:rgba(255,255,255,.88);padding-bottom:120px}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.30);pointer-events:none}
.shade.deep{background:rgba(0,0,0,.52)}
.dbl{position:absolute;inset:0;border:0;padding:0;background:transparent;touch-action:manipulation}
.pop{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--display);font-size:64px;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.5);pointer-events:none;opacity:0}
.pop.on{animation:popup .7s ease-out forwards}
@keyframes popup{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1) translateY(-30px);opacity:0}}

.bottleWrap{position:absolute;left:50%;top:50%;height:66%;aspect-ratio:140/320;transform:translate(-50%,-50%);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:ns-resize}
.bottle{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:ns-resize;overflow:visible;filter:drop-shadow(0 6px 24px rgba(0,0,0,.45))}
.bottle .fill{transition:transform .14s ease}
.lv{position:absolute;left:0;right:0;top:62%;text-align:center;font-family:var(--display);font-size:26px;line-height:1;color:#fff;mix-blend-mode:difference;pointer-events:none;font-variant-numeric:tabular-nums}
.chip-btn{position:absolute;left:50%;top:calc(83% + 8px);transform:translateX(-50%);height:40px;padding:0 16px;border:1px solid rgba(255,255,255,.5);border-radius:999px;background:rgba(0,0,0,.35);font-size:12px;font-weight:700;white-space:nowrap}
.chip-btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.slide.g .info{top:14px;bottom:auto}
.slide.g .name{font-size:24px}

.info{position:absolute;left:16px;right:104px;bottom:22px;display:flex;flex-direction:column;gap:5px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.status{align-self:flex-start;display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:900;text-shadow:none}
.status.todo{background:var(--accent);color:var(--on-accent)}
.status.ok{background:rgba(255,255,255,.18);color:#fff}
.tag{font-size:13px;font-weight:700;color:rgba(255,255,255,.9)}
.name{font-size:32px;line-height:1.15;font-weight:900;letter-spacing:-.3px}
.meta{font-size:13px;font-weight:500;color:rgba(255,255,255,.88)}
.meta .warnLoc{color:#FFD27A}

.rail{position:absolute;right:8px;bottom:22px;width:80px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ctr{display:flex;flex-direction:column;align-items:center;gap:5px}
.r-btn{width:56px;height:56px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.r-btn.plus{background:#fff;color:#111}
.r-btn.minus{width:48px;height:48px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff}
.r-btn:active{transform:scale(.92)}
.val{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.val.zero{color:var(--zero)}
.ctr .cl{font-size:11px;font-weight:700;color:rgba(255,255,255,.92);text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap}
.okBtn{width:60px;height:60px;border-radius:50%;border:2px solid var(--accent);background:rgba(0,0,0,.35);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:900;gap:1px}
.okBtn.done{background:var(--accent);color:var(--on-accent)}
.okBtn[aria-disabled="true"]{opacity:.35}
.okBtn.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.val.blank{color:rgba(255,255,255,.55)}
.ctr.want .r-btn.plus{box-shadow:0 0 0 3px var(--accent),0 0 22px var(--accent);animation:wantGlow 1.2s ease-in-out infinite}
@keyframes wantGlow{0%,100%{box-shadow:0 0 0 3px var(--accent),0 0 22px var(--accent)}50%{box-shadow:0 0 0 3px var(--accent),0 0 6px var(--accent)}}
.ctr.want .r-btn.minus{box-shadow:0 0 0 2px var(--accent)}
.status.part{background:#FFB547;color:#1A1000}

.app.lefty .rail{right:auto;left:8px}
.app.lefty .info{left:104px;right:16px;align-items:flex-end;text-align:right}
.app.lefty .status{align-self:flex-end}

.swipeHint{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;pointer-events:none;color:rgba(255,255,255,.7);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* end slides */
.end{background:var(--surface);padding:28px 20px 24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.end h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:-.3px;text-wrap:balance}
.end p{margin:0;font-size:14px;line-height:1.7;color:var(--sub)}
.pending{display:flex;flex-wrap:wrap;gap:8px}
.pending button{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:13px;font-weight:700}
.field{display:flex;flex-direction:column;gap:7px}
.field span{font-size:12px;font-weight:700;color:var(--sub)}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--surface2);padding:12px 14px;font-size:16px;resize:none}
.field textarea{min-height:96px}
.primary{height:56px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0}
.ghost{height:48px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;font-weight:700;flex-shrink:0}
.spacer{flex:1}

/* sheets */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.overlay.center{align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet h3{margin:0;font-size:17px;font-weight:900;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row .t{font-size:15px;font-weight:700}
.row .d{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5}
.seg2{display:flex;background:var(--surface2);border-radius:999px;padding:3px;flex-shrink:0}
.seg2 button{height:38px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--sub);font-size:13px;font-weight:700}
.seg2 button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.danger{height:46px;border:1px solid #5A2A2A;border-radius:999px;background:transparent;color:var(--zero);font-size:14px;font-weight:700}
.card{width:100%;max-width:400px;max-height:100%;background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.preview{flex:1;min-height:0;overflow:auto;border-radius:12px;background:#fff}
.preview img{display:block;width:100%}
.hint{font-size:12px;color:var(--sub);text-align:center;line-height:1.5;min-height:18px}
.btns{display:flex;gap:10px}.btns>*{flex:1}

/* admin */
.admin{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.admin-head{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;border-bottom:1px solid #1E1E23}
.admin-head h3{margin:0;font-size:17px;font-weight:900}
.admin-body{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}
.pin{margin:40px auto 0;width:100%;max-width:300px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.pin input{height:60px;border:1px solid var(--line);border-radius:18px;background:var(--surface2);text-align:center;font-family:var(--display);font-size:28px;letter-spacing:14px;padding-left:14px}
.pin .err{min-height:18px;font-size:13px;color:var(--zero);font-weight:700}
.cat-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px}
.cat-h b{font-size:15px;font-weight:900}
.cat-h span{font-size:12px;color:var(--sub)}
.a-item{background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.a-item input[type=text]{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:0 12px;font-size:16px;font-weight:700}
.a-row{display:flex;align-items:center;gap:8px}
.a-row select{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:0 10px;font-size:13px;color:var(--fg);font-family:inherit}
.sw{display:flex;align-items:center;gap:6px;height:40px;padding:0 4px 0 10px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:12px;font-weight:700;flex-shrink:0}
.sw i{width:38px;height:24px;border-radius:12px;background:#4A4A52;position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-pressed="true"] i{background:var(--accent)}
.sw[aria-pressed="true"] i::after{transform:translateX(14px)}
.del{height:40px;padding:0 12px;border:1px solid #5A2A2A;border-radius:12px;background:transparent;color:var(--zero);font-size:12px;font-weight:700;flex-shrink:0}
.del.arm{background:var(--zero);color:#fff;border-color:var(--zero)}
.thumb{width:48px;height:64px;flex-shrink:0;position:relative;border:1.5px dashed var(--line);border-radius:10px;background:var(--surface2) center/cover no-repeat;color:var(--sub);font-size:20px;display:flex;align-items:center;justify-content:center;padding:0}
.thumb.has{border-style:solid;border-color:transparent}
.thumbX{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;padding:0}
.a-top{display:flex;gap:10px;align-items:center}
.a-units{display:flex;gap:8px;align-items:center}
.a-units span{font-size:11px;font-weight:700;color:var(--sub);flex-shrink:0}
.a-units input[type=text]{flex:1;min-width:0;height:38px!important;font-size:14px!important;font-weight:500!important}
.a-note{font-size:11px;color:var(--sub);line-height:1.5}
.a-err{font-size:13px;font-weight:700;color:var(--zero);min-height:0}
.add{height:44px;border:1.5px dashed var(--line);border-radius:14px;background:transparent;color:var(--sub);font-size:13px;font-weight:700}
.adminLink{height:52px;border:1px solid var(--line);border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:15px;font-weight:700}

@media (prefers-reduced-motion:reduce){
  .ring .glow,.swipeHint,.ctr.want .r-btn.plus{animation:none}
  .pop.on{animation-duration:.01s}
  .bottle .fill{transition:none}
}

/* production additions */
.a-card{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.a-label{font-size:12px;font-weight:700;color:var(--sub)}
.a-card input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:0 12px;font-size:14px}
.a-top input[type=text],.a-row input[type=text]{flex:1;min-width:0;width:auto}
.mini{height:40px;min-width:40px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:14px;font-weight:700;flex-shrink:0}
.mini:disabled,.del:disabled{opacity:.3;cursor:default}
.admin-foot{flex-shrink:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid #1E1E23;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.admin-foot .primary:disabled{opacity:.35}
#adminMsg{font-size:12px;color:var(--sub);text-align:center;min-height:16px;line-height:1.5}
.textBtn{height:44px;padding:0 12px;border:0;background:transparent;font-size:14px;font-weight:700;color:var(--accent)}
.loading{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--sub);font-weight:700;background:var(--bg)}
.offline{flex-shrink:0;background:var(--zero);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:8px}
.saving{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;font-weight:900}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading"><span id="loadingText">読み込み中…</span></div>
  <div class="offline" id="offline" hidden>Wi-Fiのあるところで操作してください</div>
  <div class="saving" id="saving" hidden><span id="savingText">保存中…</span></div>
  <header class="top">
    <div class="bar">
      <div class="logo">drinkcheck</div>
      <div class="seg"><div class="seg-in" role="tablist" aria-label="フェーズ">
        <button role="tab" id="phFloor" data-phase="floor" aria-selected="true">① フロア</button>
        <button role="tab" id="phBack" data-phase="back" aria-selected="false">② 楽屋・廊下</button>
      </div></div>
      <button class="icon-btn" id="gearBtn" aria-label="設定">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <nav class="stories noscroll" id="stories" aria-label="カテゴリ"></nav>
  </header>
  <main class="reel noscroll" id="reel"></main>

  <div class="overlay" id="settings" hidden>
    <div class="sheet" role="dialog" aria-label="設定">
      <div class="grab"></div>
      <h3>設定</h3>
      <div class="row">
        <div><div class="t">利き手</div><div class="d">カウントボタンを親指側に寄せます</div></div>
        <div class="seg2">
          <button id="handL" aria-pressed="false">左手</button>
          <button id="handR" aria-pressed="true">右手</button>
        </div>
      </div>
      <button class="adminLink" id="toAdmin"><span>管理画面（品目の追加・削除）</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
      <button class="danger" id="resetBtn">入力をリセット</button>
      <button class="ghost" id="closeSettings">閉じる</button>
    </div>
  </div>

  <div class="overlay center" id="outModal" hidden>
    <div class="card" role="dialog" aria-label="チェック画像">
      <div style="font-size:16px;font-weight:900;text-align:center">チェック画像</div>
      <div class="preview"><img id="outImg" alt="在庫チェック画像"></div>
      <div class="hint" id="outHint">コピーできない時は画像を長押しで保存</div>
      <div class="btns">
        <button class="ghost" id="outClose">閉じる</button>
        <button class="primary" id="outCopy" style="height:48px">コピー</button>
      </div>
    </div>
  </div>

  <div class="admin" id="admin" hidden>
    <div class="admin-head"><h3>管理画面</h3><button class="textBtn" id="adminClose">閉じる</button></div>
    <div class="admin-body" id="adminBody"></div>
    <div class="admin-foot" id="adminFoot" hidden>
      <button class="primary" id="adminSave" disabled>変更なし</button>
      <div id="adminMsg" role="status"></div>
    </div>
    <input type="file" id="photoFile" accept="image/*" hidden>
  </div>
</div>


<script>
(function(){
/* ============================================================
   ドリンクチェック v2
   data/categories.json, data/items.json, data/config.json を読む
   items.json の追加フィールド:
     gauge: true            … 開封ボトルを残量ゲージ(100〜20%)で記録
     loc: "counter"|"back"  … 保管場所（フロア＝カウンター上 / 楽屋・廊下）。無し＝未設定（①フロアに出る）
   ============================================================ */
var REPO='vocabuki-io/drinkcheck';
var GH_API='https://api.github.com/repos/'+REPO+'/contents/';
var CAT_COLORS=['#A85A35','#6248C2','#277C77','#A86A22','#3F5788','#8C4642','#2F6B59','#7B4A63'];
var SUP_LIST=[{id:'tanoya',name:'田野屋'},{id:'suntory',name:'サントリー'},{id:'buy',name:'買い出し'}];
var SUP={};SUP_LIST.forEach(function(s){SUP[s.id]=s.name});
var BG=['#7A4A33','#2E6E6A','#7B4A63','#3F5788','#5A46A0','#8A6233','#2F6B59','#8C4642','#3B6E53','#6E4851','#47528A','#865A38'];

var RAWCATS=[],RAWITEMS=[],CONFIG={},CATS=[],CATBY={},ITEMS=[],BYID={},shas={};

var KEY='drinkcheck_v2';
var S={phase:'floor',hand:'right',vals:{},memo:'',staff:''};
try{var saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.vals)S=Object.assign(S,saved)}catch(e){}
try{if(!S.staff)S.staff=localStorage.getItem('drinkcheck_staff')||''}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}

function sortedItems(raw,cats){
  var ci={};cats.forEach(function(c,i){ci[c.id]=i});
  return raw.slice().sort(function(a,b){
    var ca=ci[a.categoryId]==null?999:ci[a.categoryId],cb=ci[b.categoryId]==null?999:ci[b.categoryId];
    return ca!==cb?ca-cb:(a.order||0)-(b.order||0);
  });
}
function rebuild(){
  CATS=RAWCATS.map(function(c,i){return{id:c.id,name:c.name,color:CAT_COLORS[i%CAT_COLORS.length]}});
  CATBY={};CATS.forEach(function(c){CATBY[c.id]=c});
  ITEMS=sortedItems(RAWITEMS,RAWCATS).filter(function(x){return CATBY[x.categoryId]}).map(function(x,i){
    var u=x.units&&x.units.length>=2?x.units:null;
    return{id:x.id,name:x.name,cat:x.categoryId,sup:x.supplier,loc:x.loc||null,gauge:!!x.gauge,units:u,image:x.image||null,bg:BG[i%BG.length]};
  });
  BYID={};ITEMS.forEach(function(it){BYID[it.id]=it;if(!S.vals[it.id])S.vals[it.id]=blankVal()});
}
function blankVal(){return{opened:null,unopened:null,level:null,lvSet:false}}
function missing(it){var v=S.vals[it.id],m=[];if(it.gauge&&!v.lvSet)m.push('残量');counters(it).forEach(function(c){if(v[c.k]==null)m.push(c.k==='opened'?'開封':'未開封')});return m}
function isDone(it){return missing(it).length===0}
function touched(it){var v=S.vals[it.id];return v.lvSet||counters(it).some(function(c){return v[c.k]!=null})}

/* ---------- data I/O ---------- */
function staticRead(path){
  return fetch(path+'?t='+Date.now()).then(function(r){if(!r.ok)throw new Error('読み込み失敗 '+r.status);return r.json()});
}
function loadAll(){
  return Promise.all([
    staticRead('data/categories.json').then(function(d){RAWCATS=d}),
    staticRead('data/items.json').then(function(d){RAWITEMS=d}),
    staticRead('data/config.json').then(function(d){CONFIG=d}).catch(function(){CONFIG={}})
  ]).then(rebuild);
}
function getPat(){try{return localStorage.getItem('drinkcheck_pat')||''}catch(e){return''}}
function ghHeaders(){return{'Authorization':'token '+getPat(),'Accept':'application/vnd.github.v3+json'}}
function ghSha(path){
  return fetch(GH_API+path+'?t='+Date.now(),{headers:ghHeaders()}).then(function(r){
    if(r.status===404)return null;if(!r.ok)throw new Error('GitHub読み込み '+r.status);return r.json().then(function(d){return d.sha})});
}
function ghPut(path,base64,message){
  return ghSha(path).then(function(sha){
    var body={message:message,content:base64};if(sha)body.sha=sha;
    return fetch(GH_API+path,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  }).then(function(r){if(!r.ok)throw new Error('GitHub書き込み '+r.status);return r.json()});
}
function ghWriteJSON(path,obj,message){
  return ghPut(path,btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2)+'\n'))),message);
}
function ghUploadImage(filename,dataUrl){
  return ghPut('images/'+filename,dataUrl.split(',')[1],'add image '+filename).then(function(){
    return'https://raw.githubusercontent.com/'+REPO+'/main/images/'+filename;
  });
}
function $(id){return document.getElementById(id)}
var app=$('app'),reel=$('reel'),stories=$('stories');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function phaseItems(ph){return ITEMS.filter(function(it){return ph==='back'?it.loc==='back':it.loc!=='back'}).sort(function(a,b){
  var ca=CATS.indexOf(CATBY[a.cat]),cb=CATS.indexOf(CATBY[b.cat]);return ca!==cb?ca-cb:ITEMS.indexOf(a)-ITEMS.indexOf(b)})}
var list=[],curIdx=0;

/* ---------- stories (ring split per item, glow = 未記入) ---------- */
function pt(a,r){var t=a*Math.PI/180;return[(34+r*Math.sin(t)).toFixed(2),(34-r*Math.cos(t)).toFixed(2)]}
function arc(a0,a1,r){var p0=pt(a0,r),p1=pt(a1,r);return'M'+p0[0]+' '+p0[1]+' A'+r+' '+r+' 0 '+(a1-a0>180?1:0)+' 1 '+p1[0]+' '+p1[1]}
function ringSVG(n,remain){
  var r=31,sw=3.6,g=n>1?Math.min(12,140/n):0,seg=360/n,lit='',dim='';
  for(var i=0;i<n;i++){
    var on=i<remain;
    var d=n===1?null:arc(i*seg+g/2,(i+1)*seg-g/2,r);
    var el=d?'<path d="'+d+'" fill="none" stroke-width="'+sw+'" stroke-linecap="round" stroke="'+(on?'var(--accent)':'var(--line)')+'"/>'
            :'<circle cx="34" cy="34" r="'+r+'" fill="none" stroke-width="'+sw+'" stroke="'+(on?'var(--accent)':'var(--line)')+'"/>';
    if(on)lit+=el;else dim+=el;
  }
  return'<svg viewBox="0 0 68 68" aria-hidden="true"><g>'+dim+'</g><g class="glow">'+lit+'</g></svg>';
}
function renderStories(){
  var curCat=list[curIdx]?list[curIdx].cat:null,h='';
  CATS.forEach(function(c){
    var its=list.filter(function(it){return it.cat===c.id});if(!its.length)return;
    var remain=its.filter(function(it){return!isDone(it)}).length;
    h+='<button class="story'+(c.id===curCat?' cur':'')+'" data-jump="'+c.id+'" aria-label="'+esc(c.name)+' 未記入'+remain+'件">'
      +'<div class="ring">'+ringSVG(its.length,remain)+'<div class="face" style="background:'+c.color+'">'+esc(c.name.charAt(0))+'</div>'
      +(remain===0?'<div class="badge"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 5 9.5 10 3"/></svg></div>':'')+'</div>'
      +'<div class="lbl">'+esc(c.name)+'</div><div class="cnt'+(remain?'':' fin')+'">'+(remain?'残り '+remain:'完了')+'</div></button>';
  });
  stories.innerHTML=h;
}

/* ---------- bottle ---------- */
var BOTTLE='M58 30 L82 30 L82 76 C82 98 118 104 118 140 L118 296 Q118 312 102 312 L38 312 Q22 312 22 296 L22 140 C22 104 58 98 58 76 Z';
function lvY(lv){return 312-2.2*(lv||0)}
function bottleSVG(it){
  var id=it.id,lv=S.vals[id].level||0,lines='';
  [20,40,60,80].forEach(function(p){lines+='<line data-p="'+p+'" x1="0" x2="140" y1="'+lvY(p)+'" y2="'+lvY(p)+'" stroke-width="1.4" stroke="'+(p<lv?'rgba(0,0,0,.2)':'rgba(255,255,255,.38)')+'"/>'});
  return'<svg class="bottle" data-bottle="'+id+'" viewBox="0 0 140 320" aria-hidden="true">'
    +'<defs><clipPath id="clip-'+id+'"><path d="'+BOTTLE+'"/></clipPath></defs>'
    +'<rect x="50" y="4" width="40" height="30" rx="5" fill="rgba(255,255,255,.88)"/>'
    +'<path d="'+BOTTLE+'" fill="rgba(255,255,255,.14)"/>'
    +'<g clip-path="url(#clip-'+id+')"><rect class="fill" x="0" y="0" width="140" height="320" fill="#fff" style="transform:translateY('+lvY(lv)+'px)"/>'+lines+'</g>'
    +'<path d="'+BOTTLE+'" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>'
    +'</svg>';
}

/* ---------- slides ---------- */
var I_PLUS='<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 11h14M11 4v14"/></svg>';
var I_MINUS='<svg width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 11h14"/></svg>';
var I_CHECK='<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 8 14.5 16 5.5"/></svg>';
function counters(it){
  if(it.units&&!it.gauge)return[{k:'opened',l:'開封('+it.units[0]+')'},{k:'unopened',l:'未開封('+it.units[1]+')'}];
  return[{k:'unopened',l:'未開封('+(it.units?it.units[1]:'本')+')'}];
}
function slideHTML(it,i){
  var v=S.vals[it.id],cat=CATBY[it.cat],h='<section class="slide'+(it.gauge?' g':'')+'" data-id="'+it.id+'">';
  h+='<div class="bg" style="background:'+it.bg+'">'+(it.image?'<img src="'+it.image+'" alt="">':(it.gauge?'':'<div class="ini">'+esc(it.name.charAt(0))+'</div>'))+'</div>';
  h+='<div class="shade'+(it.gauge?' deep':'')+'"></div>';
  h+='<button class="dbl" data-dbl="'+it.id+'" aria-label="'+esc(it.name)+' ダブルタップで未開封+1"></button>';
  h+='<div class="pop" id="pop-'+it.id+'">+1</div>';
  if(it.gauge){
    h+='<div class="bottleWrap">'+bottleSVG(it)+'<div class="lv" id="lv-'+it.id+'">'+(v.level==null?'—':v.level+'%')+'</div></div>'
      +'<label class="sr" for="rg-'+it.id+'">'+esc(it.name)+' 開封ボトルの残量</label><input class="sr" type="range" id="rg-'+it.id+'" data-range="'+it.id+'" min="20" max="100" step="20" value="'+(v.level||100)+'">'
      +'<button class="chip-btn'+(v.level==null&&v.lvSet?' on':'')+'" id="none-'+it.id+'" data-none="'+it.id+'">開封なし</button>';
  }
  var st=statusOf(it);
  h+='<div class="info"><div class="status '+st[0]+'" id="st-'+it.id+'">'+st[1]+'</div>'
    +'<div class="tag">#'+esc(cat.name)+'</div><div class="name">'+esc(it.name)+'</div>'
    +(it.loc==null?'<div class="meta"><span class="warnLoc">保管場所未設定</span></div>':'')+'</div>';
  h+='<div class="rail" id="rail-'+it.id+'">'+railHTML(it)+'</div>';
  if(i===0)h+='<div class="swipeHint"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l5-5 5 5"/></svg></div>';
  return h+'</section>';
}
function statusOf(it){
  if(isDone(it))return['ok','記入済'];
  if(touched(it))return['part',missing(it).join('・')+'がまだ'];
  return['todo','未記入'];
}
function railHTML(it){
  var v=S.vals[it.id],h='',part=touched(it);
  counters(it).forEach(function(c){
    var val=v[c.k];
    h+='<div class="ctr'+(val==null&&part?' want':'')+'"><button class="r-btn plus" data-act="inc" data-id="'+it.id+'" data-k="'+c.k+'" aria-label="'+esc(it.name+' '+c.l)+'を1増やす">'+I_PLUS+'</button>'
      +'<div class="val'+(val==null?' blank':(c.k==='unopened'&&val===0?' zero':''))+'" id="v-'+it.id+'-'+c.k+'">'+(val==null?'—':val)+'</div>'
      +'<div class="cl">'+esc(c.l)+'</div>'
      +'<button class="r-btn minus" data-act="dec" data-id="'+it.id+'" data-k="'+c.k+'" aria-label="'+esc(it.name+' '+c.l)+'を1減らす">'+I_MINUS+'</button></div>';
  });
  var d=isDone(it);
  h+='<button class="okBtn'+(d?' done':'')+'" id="ok-'+it.id+'" data-act="ok" data-id="'+it.id+'" aria-disabled="'+(!d)+'" aria-label="'+esc(it.name)+(d?' OKで次へ':' まだ入力が残っています')+'">'+I_CHECK+'OK</button>';
  return h;
}
function pendingHTML(items){
  if(!items.length)return'<p>未記入はありません。</p>';
  return'<div class="pending">'+items.map(function(it){var m=missing(it);return'<button data-goto="'+it.id+'">'+esc(it.name)+(touched(it)?'（'+m.join('・')+'）':'')+'</button>'}).join('')+'</div>';
}
function endHTML(){
  var pend=list.filter(function(it){return!isDone(it)});
  if(S.phase==='floor'){
    return'<section class="slide end" id="endSlide"><h2>'+(pend.length?'フロア あと'+pend.length+'件':'フロア完了')+'</h2>'
      +'<p>楽屋・廊下の在庫は、行けるタイミングで ② に切り替えて続けられます。入力はこの端末に残ります。</p>'
      +'<div class="field"><span>入力が残っている品目（タップで戻る）</span>'+pendingHTML(pend)+'</div>'
      +'<div class="spacer"></div><button class="primary" data-phase-go="back">② 楽屋・廊下へ進む</button></section>';
  }
  var all=ITEMS.filter(function(it){return!isDone(it)});
  return'<section class="slide end" id="endSlide"><h2>提出</h2>'
    +'<div class="field"><span>入力が残っている品目 '+all.length+'件（タップで戻る）</span>'+pendingHTML(all)+'</div>'
    +'<label class="field"><span>担当者名</span><input id="staff" autocomplete="off" value="'+esc(S.staff)+'"></label>'
    +'<label class="field"><span>メモ</span><textarea id="memo" placeholder="買い出し依頼や連絡事項">'+esc(S.memo)+'</textarea></label>'
    +'<div class="spacer"></div><button class="primary" id="makeImg">チェック画像を作成</button></section>';
}
function renderReel(){
  list=phaseItems(S.phase);
  reel.innerHTML=list.map(slideHTML).join('')+endHTML();
  reel.scrollTop=0;curIdx=0;
  $('phFloor').setAttribute('aria-selected',S.phase==='floor');
  $('phBack').setAttribute('aria-selected',S.phase==='back');
  renderStories();
}
function refreshEnd(){var e=$('endSlide');if(!e)return;var tmp=document.createElement('div');tmp.innerHTML=endHTML();e.replaceWith(tmp.firstChild)}

/* ---------- updates ---------- */
function refreshItem(id){
  var it=BYID[id];if(!it)return;
  var st=$('st-'+id);if(st){var x=statusOf(it);st.className='status '+x[0];st.textContent=x[1]}
  var r=$('rail-'+id);if(r)r.innerHTML=railHTML(it);
  renderStories();refreshEnd();
}
function setVal(id,k,delta){
  var cur=S.vals[id][k];
  S.vals[id][k]=cur==null?(delta>0?1:0):Math.max(0,cur+delta);
  save();refreshItem(id);
}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}}
function setLevel(id,lv){
  var v=S.vals[id];if(v.level===lv&&v.lvSet)return;
  if(v.level!==lv)buzz();
  var was=v.lvSet;v.level=lv;v.lvSet=true;
  var svg=reel.querySelector('[data-bottle="'+id+'"]');
  if(svg){svg.querySelector('.fill').style.transform='translateY('+lvY(lv)+'px)';
    svg.querySelectorAll('line').forEach(function(l){var p=+l.getAttribute('data-p');l.setAttribute('stroke',p<(lv||0)?'rgba(0,0,0,.2)':'rgba(255,255,255,.38)')})}
  $('lv-'+id).textContent=lv==null?'—':lv+'%';
  $('none-'+id).classList.toggle('on',lv==null);
  if(lv!=null){var rg=$('rg-'+id);if(rg)rg.value=lv}
  save();
  if(!was)refreshItem(id);
}
function levelFromEvent(svg,e){
  var r=svg.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*320,f=(312-y)/220;
  return Math.max(20,Math.min(100,Math.ceil(f*5-1e-9)*20));
}
function slideH(){return reel.clientHeight}
function goTo(i,smooth){reel.scrollTo({top:i*slideH(),behavior:smooth?'smooth':'auto'})}
function setSlideH(){document.documentElement.style.setProperty('--slideH',reel.clientHeight+'px')}

/* ---------- events ---------- */
var lastTap={};
reel.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(b){var id=b.getAttribute('data-id'),k=b.getAttribute('data-k'),a=b.getAttribute('data-act');
    if(a==='inc')setVal(id,k,1);
    else if(a==='dec')setVal(id,k,-1);
    else if(a==='ok'){
      if(isDone(BYID[id])){var i=list.indexOf(BYID[id]);goTo(i+1,true)}
      else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');buzz()}
    }
    return}
  var d=e.target.closest('[data-dbl]');
  if(d){var did=d.getAttribute('data-dbl'),now=Date.now();
    if(lastTap[did]&&now-lastTap[did]<320){lastTap[did]=0;setVal(did,'unopened',1);
      var p=$('pop-'+did);p.classList.remove('on');void p.offsetWidth;p.classList.add('on')}
    else lastTap[did]=now;return}
  var n=e.target.closest('[data-none]');
  if(n){setLevel(n.getAttribute('data-none'),null);return}
  var g=e.target.closest('[data-goto]');
  if(g){goTo(list.indexOf(BYID[g.getAttribute('data-goto')]),true);if(list.indexOf(BYID[g.getAttribute('data-goto')])<0){S.phase=BYID[g.getAttribute('data-goto')].loc==='back'?'back':'floor';save();renderReel();goTo(list.indexOf(BYID[g.getAttribute('data-goto')]),false)}return}
  var pg=e.target.closest('[data-phase-go]');
  if(pg){S.phase=pg.getAttribute('data-phase-go');save();renderReel();return}
  if(e.target.closest('#makeImg'))makeImage();
});
reel.addEventListener('input',function(e){
  if(e.target.id==='memo'){S.memo=e.target.value;save()}
  else if(e.target.id==='staff'){S.staff=e.target.value;save()}
  else if(e.target.hasAttribute('data-range'))setLevel(e.target.getAttribute('data-range'),parseInt(e.target.value,10));
});
/* bottle drag wins over swipe: touching the bottle area locks the reel until release */
var drag=null;
function bottleFrom(t){var w=t&&t.closest?t.closest('.bottleWrap'):null;return w?w.querySelector('[data-bottle]'):null}
function lockReel(on){reel.style.overflowY=on?'hidden':'';reel.style.scrollSnapType=on?'none':''}
function dragTo(pt){if(drag)setLevel(drag.getAttribute('data-bottle'),levelFromEvent(drag,pt))}
function endDrag(){if(drag){drag=null;lockReel(false)}}
reel.addEventListener('touchstart',function(e){
  var svg=bottleFrom(e.target);if(!svg)return;
  e.preventDefault();drag=svg;lockReel(true);dragTo(e.touches[0]);
},{passive:false});
reel.addEventListener('touchmove',function(e){if(drag){e.preventDefault();dragTo(e.touches[0])}},{passive:false});
['touchend','touchcancel'].forEach(function(t){reel.addEventListener(t,endDrag)});
reel.addEventListener('pointerdown',function(e){
  if(e.pointerType==='touch')return;
  var svg=bottleFrom(e.target);if(!svg)return;
  e.preventDefault();drag=svg;lockReel(true);try{svg.setPointerCapture(e.pointerId)}catch(err){}
  dragTo(e);
});
reel.addEventListener('pointermove',function(e){if(e.pointerType!=='touch')dragTo(e)});
['pointerup','pointercancel'].forEach(function(t){reel.addEventListener(t,function(e){if(e.pointerType!=='touch')endDrag()})});
var scrollT;
reel.addEventListener('scroll',function(){
  var i=Math.round(reel.scrollTop/Math.max(1,slideH()));
  if(i!==curIdx){curIdx=i;renderStories()}
});
stories.addEventListener('click',function(e){
  var b=e.target.closest('[data-jump]');if(!b)return;
  var c=b.getAttribute('data-jump');
  var first=list.findIndex(function(it){return it.cat===c&&!isDone(it)});
  if(first<0)first=list.findIndex(function(it){return it.cat===c});
  goTo(first,true);
});
document.querySelectorAll('[data-phase]').forEach(function(b){b.addEventListener('click',function(){
  if(S.phase===b.getAttribute('data-phase'))return;S.phase=b.getAttribute('data-phase');save();renderReel()})});

/* settings */
function applyHand(){app.classList.toggle('lefty',S.hand==='left');$('handL').setAttribute('aria-pressed',S.hand==='left');$('handR').setAttribute('aria-pressed',S.hand==='right')}
$('gearBtn').addEventListener('click',function(){$('settings').hidden=false});
$('closeSettings').addEventListener('click',function(){$('settings').hidden=true;resetArm=false;$('resetBtn').textContent='入力をリセット'});
$('settings').addEventListener('click',function(e){if(e.target===this)$('closeSettings').click()});
$('handL').addEventListener('click',function(){S.hand='left';applyHand();save()});
$('handR').addEventListener('click',function(){S.hand='right';applyHand();save()});
var resetArm=false;
$('resetBtn').addEventListener('click',function(){
  if(!resetArm){resetArm=true;this.textContent='もう一度押すとリセット';return}
  resetArm=false;this.textContent='入力をリセット';
  ITEMS.forEach(function(it){S.vals[it.id]=blankVal()});S.memo='';save();
  $('settings').hidden=true;renderReel();
});

/* ---------- admin (下書き → 「GitHubに保存」で反映) ---------- */
var adminUnlocked=false,armed=null,photoTarget=null;
var D=null; /* {cats, items, photos:{id:dataUrl}, dirty} */
var LOCS=[['counter','フロア（カウンター上）'],['back','楽屋・廊下'],['','保管場所 未設定']];
function clone(o){return JSON.parse(JSON.stringify(o))}
function dItem(id){for(var i=0;i<D.items.length;i++)if(D.items[i].id===id)return D.items[i];return null}
function dCatItems(cid){return D.items.filter(function(x){return x.categoryId===cid}).sort(function(a,b){return(a.order||0)-(b.order||0)})}
function markDirty(){D.dirty=true;updateSaveBar()}
function updateSaveBar(){
  var b=$('adminSave');if(!b)return;
  b.disabled=!D||!D.dirty;b.textContent=D&&D.dirty?'GitHubに保存':'変更なし';
  $('adminClose').textContent=armed==='__close'?'保存せずに閉じる':'閉じる';
}
function openAdmin(){
  $('settings').hidden=true;$('admin').hidden=false;armed=null;
  D={cats:clone(RAWCATS),items:clone(RAWITEMS),photos:{},dirty:false};
  renderAdmin();
}
function closeAdmin(force){
  if(D&&D.dirty&&!force){armed='__close';updateSaveBar();return}
  $('admin').hidden=true;armed=null;D=null;updateSaveBar();
}
function patHTML(){
  var p=getPat();
  return'<div class="a-card"><div class="a-label">GitHubの鍵（PAT）</div>'
    +'<div class="a-row"><label class="sr" for="patIn">PAT</label><input type="password" id="patIn" placeholder="ghp_..." value="'+esc(p)+'" autocomplete="off">'
    +'<button class="mini" id="patSave">保存</button></div>'
    +'<div class="a-note" id="patStatus">'+(p?'この端末に設定済み':'未設定（保存に必要。端末ごとに1回）')+'</div></div>';
}
function catsHTML(){
  var h='<div class="cat-h"><b>カテゴリ</b><span>'+D.cats.length+'件</span></div>';
  D.cats.forEach(function(c,i){
    var n=D.items.filter(function(x){return x.categoryId===c.id}).length;
    h+='<div class="a-item" data-cid="'+c.id+'"><div class="a-row">'
      +'<label class="sr" for="cn-'+c.id+'">カテゴリ名</label><input type="text" id="cn-'+c.id+'" data-f="cname" value="'+esc(c.name)+'">'
      +'<button class="mini" data-f="cup" aria-label="上へ"'+(i===0?' disabled':'')+'>↑</button>'
      +'<button class="mini" data-f="cdown" aria-label="下へ"'+(i===D.cats.length-1?' disabled':'')+'>↓</button>'
      +'<button class="del'+(armed==='c:'+c.id?' arm':'')+'" data-f="cdel"'+(n?' disabled title="品目があるカテゴリは削除できません"':'')+'>'+(armed==='c:'+c.id?'削除する':'削除')+'</button>'
      +'</div></div>';
  });
  return h+'<button class="add" id="addCat">＋ カテゴリを追加</button>';
}
function itemHTML(x,i,n){
  var ph=D.photos[x.id]||x.image||null,u=x.units||['',''];
  return'<div class="a-item" data-aid="'+x.id+'">'
    +'<div class="a-top"><button class="thumb'+(ph?' has':'')+'" data-f="photo" aria-label="'+esc(x.name)+'の写真を'+(ph?'変更':'追加')+'"'+(ph?' style="background-image:url('+ph+')"':'')+'>'+(ph?'':'＋')
    +(ph?'<span class="thumbX" data-f="unphoto" role="presentation"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l6 6M8 2 2 8"/></svg></span>':'')+'</button>'
    +'<label class="sr" for="nm-'+x.id+'">品名</label><input type="text" id="nm-'+x.id+'" data-f="name" value="'+esc(x.name)+'">'
    +'<button class="mini" data-f="up" aria-label="上へ"'+(i===0?' disabled':'')+'>↑</button>'
    +'<button class="mini" data-f="down" aria-label="下へ"'+(i===n-1?' disabled':'')+'>↓</button></div>'
    +'<div class="a-row"><label class="sr" for="lc-'+x.id+'">保管場所</label><select id="lc-'+x.id+'" data-f="loc">'
    +LOCS.map(function(l){return'<option value="'+l[0]+'"'+((x.loc||'')===l[0]?' selected':'')+'>'+l[1]+'</option>'}).join('')+'</select>'
    +'<label class="sr" for="sp-'+x.id+'">仕入先</label><select id="sp-'+x.id+'" data-f="sup">'
    +SUP_LIST.map(function(s){return'<option value="'+s.id+'"'+(x.supplier===s.id?' selected':'')+'>'+s.name+'</option>'}).join('')+'</select></div>'
    +'<div class="a-row"><label class="sr" for="ct-'+x.id+'">カテゴリ</label><select id="ct-'+x.id+'" data-f="cat">'
    +D.cats.map(function(c){return'<option value="'+c.id+'"'+(x.categoryId===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select>'
    +'<button class="sw" data-f="gauge" aria-pressed="'+(!!x.gauge)+'">残量<i></i></button>'
    +'<button class="del'+(armed===x.id?' arm':'')+'" data-f="del">'+(armed===x.id?'削除する':'削除')+'</button></div>'
    +'<div class="a-units"><span>単位</span><label class="sr" for="u1-'+x.id+'">開封の単位</label><input type="text" id="u1-'+x.id+'" data-f="u1" placeholder="開封（例: 本）" value="'+esc(u[0])+'">'
    +'<label class="sr" for="u2-'+x.id+'">未開封の単位</label><input type="text" id="u2-'+x.id+'" data-f="u2" placeholder="未開封（例: 箱）" value="'+esc(u[1])+'"></div>'
    +(x.gauge&&x.units?'<div class="a-note">残量ゲージがONなので、開封はゲージで記録されます（単位2は未開封に使います）</div>':'')
    +'</div>';
}
function renderAdmin(){
  var b=$('adminBody');
  if(!adminUnlocked){
    $('adminFoot').hidden=true;
    b.innerHTML='<form class="pin" id="pinForm"><div style="font-size:15px;font-weight:700">PINを入力</div><label class="sr" for="pinIn">PIN</label>'
      +'<input id="pinIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><div class="err" id="pinErr"></div>'
      +'<button class="primary" type="submit">開く</button></form>';
    setTimeout(function(){var i=$('pinIn');if(i)i.focus()},60);return;
  }
  $('adminFoot').hidden=false;
  var sc=b.scrollTop,h=patHTML()+catsHTML();
  D.cats.forEach(function(c){
    var its=dCatItems(c.id);
    h+='<div class="cat-h"><b>'+esc(c.name)+'</b><span>'+its.length+'品目</span></div>';
    its.forEach(function(x,i){h+=itemHTML(x,i,its.length)});
    h+='<button class="add" data-add="'+c.id+'">＋ 品目を追加</button>';
  });
  b.innerHTML=h;b.scrollTop=sc;updateSaveBar();
}
function swapOrder(list,i,j){var t=list[i].order||0;list[i].order=list[j].order||0;list[j].order=t;if(list[i].order===list[j].order){list[i].order=j;list[j].order=i}}
function normalizeOrders(){D.cats.forEach(function(c){dCatItems(c.id).forEach(function(x,i){x.order=i})})}

$('toAdmin').addEventListener('click',openAdmin);
$('adminClose').addEventListener('click',function(){closeAdmin(armed==='__close')});
$('photoFile').addEventListener('change',function(e){
  var file=e.target.files&&e.target.files[0],id=photoTarget;if(!file||!id)return;
  var r=new FileReader();
  r.onload=function(ev){var im=new Image();im.onload=function(){
    var MAX=800,w=im.width,h=im.height,k=Math.min(1,MAX/w);w=Math.round(w*k);h=Math.round(h*k);
    var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    D.photos[id]=c.toDataURL('image/jpeg',.8);markDirty();renderAdmin();
  };im.src=ev.target.result};
  r.readAsDataURL(file);
});
$('adminBody').addEventListener('submit',function(e){
  e.preventDefault();
  if($('pinIn').value===String(CONFIG.adminPin||'2452')){adminUnlocked=true;renderAdmin()}
  else{$('pinErr').textContent='PINが違います';$('pinIn').value='';$('pinIn').focus()}
});
$('adminBody').addEventListener('input',function(e){
  var f=e.target.getAttribute('data-f');
  var crow=e.target.closest('[data-cid]');
  if(crow&&f==='cname'){var c=D.cats.filter(function(x){return x.id===crow.getAttribute('data-cid')})[0];if(c){c.name=e.target.value||'（名前なし）';markDirty()}return}
  var row=e.target.closest('[data-aid]');if(!row)return;
  var x=dItem(row.getAttribute('data-aid'));if(!x)return;
  if(f==='name'){x.name=e.target.value||'（名前なし）';markDirty()}
  else if(f==='u1'||f==='u2'){
    var a=$('u1-'+x.id).value.trim(),b=$('u2-'+x.id).value.trim();
    if(a||b)x.units=[a||'開封',b||'未開封'];else delete x.units;markDirty();
  }
});
$('adminBody').addEventListener('change',function(e){
  var row=e.target.closest('[data-aid]');if(!row)return;
  var x=dItem(row.getAttribute('data-aid')),f=e.target.getAttribute('data-f');if(!x)return;
  if(f==='loc'){if(e.target.value)x.loc=e.target.value;else delete x.loc;markDirty()}
  else if(f==='sup'){x.supplier=e.target.value;markDirty()}
  else if(f==='cat'){x.categoryId=e.target.value;x.order=dCatItems(x.categoryId).length+1000;normalizeOrders();markDirty();renderAdmin()}
});
$('adminBody').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t||t.disabled)return;
  if(t.id==='patSave'){
    var v=$('patIn').value.trim();
    try{if(v)localStorage.setItem('drinkcheck_pat',v);else localStorage.removeItem('drinkcheck_pat')}catch(err){}
    $('patStatus').textContent=v?'保存しました':'削除しました';return;
  }
  if(t.id==='addCat'){D.cats.push({id:'cat-'+Date.now(),name:'新しいカテゴリ',order:D.cats.length});armed=null;markDirty();renderAdmin();return}
  var add=t.getAttribute('data-add');
  if(add){
    var same=dCatItems(add),last=same[same.length-1];
    var nx={id:'item-'+Date.now(),name:'新しい品目',categoryId:add,supplier:last?last.supplier:'buy',order:same.length};
    D.items.push(nx);armed=null;markDirty();renderAdmin();
    var inp=$('nm-'+nx.id);if(inp){inp.focus();inp.select()}
    return;
  }
  var f=t.getAttribute('data-f');
  var crow=t.closest('[data-cid]');
  if(crow){
    var cid=crow.getAttribute('data-cid'),ci=-1;D.cats.forEach(function(c,i){if(c.id===cid)ci=i});
    if(f==='cup'||f==='cdown'){var j=f==='cup'?ci-1:ci+1;var tmp=D.cats[ci];D.cats[ci]=D.cats[j];D.cats[j]=tmp;D.cats.forEach(function(c,i){c.order=i});markDirty();renderAdmin()}
    else if(f==='cdel'){if(armed==='c:'+cid){D.cats.splice(ci,1);armed=null;markDirty()}else armed='c:'+cid;renderAdmin()}
    return;
  }
  var row=t.closest('[data-aid]');if(!row)return;
  var id=row.getAttribute('data-aid'),x=dItem(id);
  if(e.target.closest('[data-f="unphoto"]')){delete D.photos[id];delete x.image;markDirty();renderAdmin();return}
  if(f==='photo'){photoTarget=id;$('photoFile').value='';$('photoFile').click();return}
  if(f==='gauge'){if(x.gauge)delete x.gauge;else x.gauge=true;markDirty();renderAdmin();return}
  if(f==='up'||f==='down'){var its=dCatItems(x.categoryId),i=its.indexOf(x),j=f==='up'?i-1:i+1;normalizeOrders();swapOrder(its,i,j);markDirty();renderAdmin();return}
  if(f==='del'){
    if(armed===id){D.items=D.items.filter(function(i){return i.id!==id});delete D.photos[id];armed=null;markDirty()}
    else armed=id;
    renderAdmin();
  }
});
$('adminSave').addEventListener('click',function(){
  if(!D||!D.dirty)return;
  if(!getPat()){$('adminMsg').textContent='先にGitHubの鍵（PAT）を設定してください';return}
  var msg=$('adminMsg');msg.textContent='';
  showSaving('保存中…');
  var ids=Object.keys(D.photos);
  var chain=Promise.resolve();
  ids.forEach(function(id){chain=chain.then(function(){
    return ghUploadImage(id+'-'+Date.now()+'.jpg',D.photos[id]).then(function(url){var x=dItem(id);if(x)x.image=url;delete D.photos[id]});
  })});
  chain.then(function(){normalizeOrders();if(JSON.stringify(D.cats)===JSON.stringify(RAWCATS))return;return ghWriteJSON('data/categories.json',D.cats,'update categories')})
  .then(function(){return ghWriteJSON('data/items.json',D.items,'update items')})
  .then(function(){
    RAWCATS=clone(D.cats);RAWITEMS=clone(D.items);D.dirty=false;armed=null;
    rebuild();renderReel();renderAdmin();hideSaving();
    msg.textContent='保存しました。他の端末には1〜2分で反映されます';
  }).catch(function(err){hideSaving();msg.textContent='保存できませんでした（'+err.message+'）。鍵（PAT）と通信を確認してください'});
});
function showSaving(t){$('savingText').textContent=t;$('saving').hidden=false}
function hideSaving(){$('saving').hidden=true}
/* ---------- output image ---------- */
var FONT='"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';
function f(w,s){return w+' '+s+'px '+FONT}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function cellTexts(it){
  var v=S.vals[it.id];
  var op=it.gauge?(!v.lvSet?'未記入':(v.level==null?'なし':v.level+'%')):(it.units?(v.opened==null?'未記入':v.opened+it.units[0]):'—');
  var un=v.unopened==null?'未記入':v.unopened+(it.units?it.units[1]:'本');
  return{op:op,un:un,zero:v.unopened==null||v.unopened===0,opBlank:op==='未記入'};
}
function makeImage(){
  var groups={},order=[];
  ITEMS.forEach(function(it){if(!groups[it.sup]){groups[it.sup]=[];order.push(it.sup)}groups[it.sup].push(it)});
  var W=680,pad=32,S2=2,head=94,gh=44,cl=24,rh=44,gg=18,col=120;
  var c=document.createElement('canvas'),ctx=c.getContext('2d');
  var memo=(S.memo||'').trim(),ml=[];
  if(memo){ctx.font=f('500',16);memo.split('\n').forEach(function(p){var line='';for(var i=0;i<p.length;i++){var nx=line+p[i];if(line&&ctx.measureText(nx).width>W-pad*2-32){ml.push(line);line=p[i]}else line=nx}ml.push(line)})}
  var mh=ml.length?18+26+ml.length*25+18:0;
  var H=pad+head;order.forEach(function(s){H+=gh+cl+groups[s].length*rh+gg});H+=mh+pad;
  c.width=W*S2;c.height=H*S2;ctx.scale(S2,S2);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  var now=new Date(),ds=now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0');
  var y=pad;ctx.fillStyle='#111';ctx.font=f('900',28);ctx.fillText('在庫チェック',pad,y+26);
  ctx.fillStyle='#8e8e93';ctx.font=f('700',15);
  var m2='担当: '+(S.staff||'—');ctx.fillText(ds,W-pad-ctx.measureText(ds).width,y+12);ctx.fillText(m2,W-pad-ctx.measureText(m2).width,y+32);
  ctx.fillStyle='#e5e5ea';ctx.fillRect(pad,pad+head-14,W-pad*2,1);y=pad+head;
  var cx2=W-pad-col/2,cx1=cx2-col;
  order.forEach(function(s){
    rr(ctx,pad,y,W-pad*2,34,10);ctx.fillStyle='#f0f0f5';ctx.fill();
    ctx.fillStyle='#111';ctx.font=f('900',16);ctx.fillText(SUP[s],pad+14,y+22);y+=gh;
    ctx.fillStyle='#8e8e93';ctx.font=f('700',12);
    ['名前','開封済み','未開封'].forEach(function(t,i){var x=i===0?pad+16:(i===1?cx1:cx2)-ctx.measureText(t).width/2;ctx.fillText(t,x,y+13)});y+=cl;
    groups[s].forEach(function(it){
      var t=cellTexts(it),cy=y+rh/2+7;
      ctx.fillStyle=t.zero?'#D70015':'#111';ctx.font=f('700',18);ctx.fillText(it.name,pad+16,cy);
      ctx.font=f('900',20);
      ctx.fillStyle=t.opBlank?'#D70015':(t.op==='—'||t.op==='なし'?'#c7c7cc':'#111');ctx.fillText(t.op,cx1-ctx.measureText(t.op).width/2,cy);
      ctx.fillStyle=t.zero?'#D70015':'#111';ctx.fillText(t.un,cx2-ctx.measureText(t.un).width/2,cy);
      ctx.fillStyle='#f2f2f5';ctx.fillRect(pad+16,y+rh-1,W-pad*2-32,1);y+=rh;
    });
    y+=gg;
  });
  if(ml.length){rr(ctx,pad,y,W-pad*2,mh-18,12);ctx.fillStyle='#f7f7fa';ctx.fill();ctx.fillStyle='#8e8e93';ctx.font=f('700',12);ctx.fillText('MEMO',pad+16,y+22);
    ctx.fillStyle='#111';ctx.font=f('500',16);ml.forEach(function(l,i){ctx.fillText(l,pad+16,y+48+i*25)})}
  outCanvas=c;$('outImg').src=c.toDataURL('image/png');$('outHint').textContent='コピーできない時は画像を長押しで保存';$('outModal').hidden=false;
}
var outCanvas=null;
$('outClose').addEventListener('click',function(){$('outModal').hidden=true});
$('outCopy').addEventListener('click',function(){
  var hint=$('outHint');
  try{
    var p=new Promise(function(res,rej){outCanvas.toBlob(function(b){b?res(b):rej()},'image/png')});
    navigator.clipboard.write([new ClipboardItem({'image/png':p})]).then(function(){hint.textContent='画像をコピーしました'}).catch(function(){hint.textContent='この画面ではコピーできません。画像を長押しで保存してください'});
  }catch(err){hint.textContent='この画面ではコピーできません。画像を長押しで保存してください'}
});

function checkOnline(){function u(){$('offline').hidden=navigator.onLine}window.addEventListener('online',u);window.addEventListener('offline',u);u()}
checkOnline();applyHand();
loadAll().then(function(){$('loading').hidden=true;renderReel();setSlideH()})
  .catch(function(err){console.error(err);$('loadingText').textContent='読み込みに失敗しました。ページを再読み込みしてください'});

})();
